<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Maroc - Coupe du Monde 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.min.css" rel="stylesheet">
    
    <style>
        /* Thème Premium Dark */
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f19;
            color: #f8f9fa;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding-top: 158px; 
            padding-bottom: 70px; 
        }

        /* Header Fixe Compact et Centré */
        .hero-header {
            background: linear-gradient(135deg, #8b0000 0%, #111827 100%);
            border-bottom: 3px solid #006233;
            padding: 8px 15px; 
            text-align: center;
            position: fixed;
            top: 0; 
            left: 0;
            width: 100%;
            z-index: 1030;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header-logo img {
            width: 38px; 
            height: auto;
            border-radius: 4px;
            display: inline-block;
        }

        /* Message Marquee placé juste en dessous du Header */
        .welcome-marquee {
            background-color: #006233;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 0;
            position: fixed;
            top: 93px; 
            left: 0;
            width: 100%;
            z-index: 1020;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* Bouton Admin */
        .btn-admin-login {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.05);
            color: #a0aec0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-admin-login:hover {
            background: #8b0000;
            color: #fff;
            border-color: #8b0000;
        }
        .admin-badge {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #8b0000;
            color: white;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Cartes Style Glassmorphism */
        .match-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .match-header {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
            color: #a0aec0;
        }

        .match-body {
            padding: 15px 15px 10px 15px;
        }

        .team-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 35%;
            position: relative;
        }

        .flag-img {
            width: 55px;
            height: 38px;
            border-radius: 6px;
            margin-bottom: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            object-fit: cover;
        }

        .team-name {
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .match-result {
            font-size: 0.85rem;
            font-weight: bold;
            color: #00ff87;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 4px;
        }

        .vs-box {
            width: 30%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .badge-vs {
            background: linear-gradient(135deg, #8b0000, #006233);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .countdown-timer {
            font-size: 0.7rem;
            margin-top: 6px;
            color: #ffaa44;
            font-family: monospace;
            font-weight: 600;
        }

        .match-actions {
            background: rgba(0, 0, 0, 0.15);
            padding: 10px 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .btn-action {
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            padding: 6px 12px;
        }

        .btn-info-match {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-comment-match {
            background: #006233;
            color: #ffffff;
            border: none;
        }

        /* Indicateur de chargement */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #00ff87;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #00ff87;
            font-weight: 600;
            padding: 20px;
        }

        /* Styles pour les messages de discussion avec préservation des sauts de ligne et alignement justifié */
        .comment-message {
            white-space: pre-wrap;
            word-wrap: break-word;
            word-break: break-word;
            text-align: justify;
            line-height: 1.5;
            font-size: 0.85rem;
        }

        /* ---------------------------------------------------- */
        /* STRUCTURE DE L'ESPACE DISCUSSION PLEIN ÉCRAN FIGÉ    */
        /* ---------------------------------------------------- */
        
        .swal2-popup-fullscreen-maroc {
            background: linear-gradient(135deg, #8b0000 0%, #052e16 100%) !important;
            color: #f8f9fa !important;
            padding: 0 !important;
            height: 100vh !important;
            width: 100vw !important;
            max-width: none !important;
            border-radius: 0 !important;
            display: flex !important;
            flex-direction: column !important;
        }

        .swal2-popup-fullscreen-maroc .swal2-html-container {
            margin: 0 !important;
            padding: 0 !important;
            flex: 1 !important;
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
            height: 100% !important;
        }

        /* Header fixe de la modale */
        .discussion-header-fixed {
            background: linear-gradient(135deg, #8b0000 0%, #111827 100%);
            padding: 15px 20px;
            border-bottom: 3px solid #00ff87;
            flex-shrink: 0;
            text-align: center;
        }

        .discussion-header-fixed h3 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .discussion-header-fixed p {
            margin: 5px 0 0;
            font-size: 0.8rem;
            color: #00ff87;
        }

        /* Zone de la liste des messages : Seule zone autorisée à scroller */
        .comment-container-fullscreen {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: rgba(0, 0, 0, 0.5) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 15px;
            margin: 0;
        }

        /* Footer fixe de la modale avec le bouton d'ajout seulement */
        .discussion-footer-fixed {
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(10px);
            border-top: 2px solid rgba(0, 255, 135, 0.3);
            padding: 15px 20px;
            flex-shrink: 0;
        }

        .btn-add-comment {
            background: linear-gradient(135deg, #006233, #008844);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-add-comment:active {
            transform: scale(0.98);
        }

        .root-comment {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .reply-comment {
            background: rgba(0, 255, 135, 0.04);
            border-left: 3px solid #00ff87;
            border-radius: 0 6px 6px 0;
            padding: 8px;
            margin-top: 8px;
            margin-left: 20px;
        }

        .btn-reply-link {
            background: none;
            border: none;
            color: #00ff87;
            font-size: 0.75rem;
            padding: 0;
            text-decoration: underline;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-reply-link:hover {
            opacity: 0.8;
        }

        .admin-checkbox {
            width: 18px;
            height: 18px;
            accent-color: #ff3333;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .admin-bulk-bar {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }

        /* Style Popups classiques */
        .swal2-popup-dark {
            background: #111827 !important;
            color: #f8f9fa !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px !important;
            width: 95% !important;
            max-width: 500px !important;
        }

        /* Modale d'ajout de message - Positionnée pour être visible au-dessus du clavier */
        .swal2-popup-message-form {
            background: linear-gradient(135deg, #1a1f2e, #0b0f19) !important;
            color: #f8f9fa !important;
            border-radius: 24px !important;
            width: 92% !important;
            max-width: 450px !important;
            padding: 0 !important;
            overflow: hidden !important;
            position: relative !important;
        }

        .message-form-container {
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        /* Style pour le champ textarea */
        .message-form-container textarea {
            min-height: 120px;
            font-size: 16px !important;
        }

        .reply-badge {
            background: #006233;
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        /* Style spécifique pour les inputs sur mobile */
        input, textarea {
            font-size: 16px !important;
        }

        .app-footer {
            background-color: #0b0f19;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1020;
            padding: 12px 0;
            text-align: center;
            font-size: 0.8rem;
            color: #a0aec0;
        }

        /* Amélioration du scroll pour une meilleure expérience */
        .comment-container-fullscreen::-webkit-scrollbar {
            width: 8px;
        }

        .comment-container-fullscreen::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        .comment-container-fullscreen::-webkit-scrollbar-thumb {
            background: #00ff87;
            border-radius: 4px;
        }

        .comment-container-fullscreen::-webkit-scrollbar-thumb:hover {
            background: #00cc6a;
        }
    </style>
</head>
<body>

    <header class="hero-header">
        <div class="position-relative w-100 d-flex flex-column align-items-center justify-content-center">
            <div class="header-logo mb-1">
                <img src="https://flagcdn.com/w80/ma.png" alt="Maroc">
            </div>
            <h1 class="h5 mb-0 fw-bold text-white text-uppercase" style="font-size: 1.2rem; letter-spacing: 0.5px; color: #ffffff !important; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">
                Lions de l'Atlas
            </h1>
            <p class="text-white-50 small mb-0" style="font-size: 0.75rem; opacity: 0.95; color: #e0e0e0 !important;">
                Coupe du Monde FIFA 2026 — Groupe C
            </p>
            <div id="admin-zone">
                <button class="btn-admin-login" onclick="demanderConnexionAdmin()">
                    <i class="fa-solid fa-lock me-1"></i>Admin
                </button>
            </div>
        </div>
    </header>

    <div class="welcome-marquee">
        <marquee behavior="scroll" direction="left" scrollamount="5">
            Dima Maghrib ! Rejoignez le fil de discussion en direct et répondez aux messages des autres supporters ! 🇲🇦
        </marquee>
    </div>

    <main class="container px-3">
        <h2 class="h6 text-uppercase fw-bold mb-3 px-1" style="color: #00ff87 !important; text-shadow: 0 0 8px rgba(0,255,135,0.3);">
            <i class="fa-solid fa-calendar-days me-1" style="color: #ff4444;"></i> Calendrier de la phase de groupes
        </h2>
        <div id="matches-container"></div>
    </main>

    <footer class="app-footer">
        <p class="mb-0">M. Seddik Elidrissi &copy; 2026 — Tous droits réservés</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const GOOGLE_SHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz9utojYkIxj1cI7Zvt3O89BoMGQy5zYe8wDVe_-Ph1lf6oOLciqpH0qwei1y9VuAtp/exec";

        // RÉSULTATS DES MATCHS - MODIFIABLES DIRECTEMENT ICI
        const matchResults = {
            1: { homeScore: 0, awayScore: 0 },
            2: { homeScore: 0, awayScore: 0 },
            3: { homeScore: 0, awayScore: 0 }
        };

        const matchesData = [
            {
                id: 1,
                stage: "Groupe C - Match 1",
                homeTeam: "Brésil",
                homeFlagUrl: "https://flagcdn.com/w160/br.png", 
                awayTeam: "Maroc",
                awayFlagUrl: "https://flagcdn.com/w160/ma.png",  
                dateStr: "13/06/2026",
                timeStr: "23:00",
                timestamp: "2026-06-13T23:00:00+01:00",
                stadium: "MetLife Stadium",
                city: "East Rutherford (NJ)"
            },
            {
                id: 2,
                stage: "Groupe C - Match 2",
                homeTeam: "Écosse",
                homeFlagUrl: "https://flagcdn.com/w160/gb-sct.png", 
                awayTeam: "Maroc",
                awayFlagUrl: "https://flagcdn.com/w160/ma.png",   
                dateStr: "19/06/2026",
                timeStr: "23:00",
                timestamp: "2026-06-19T23:00:00+01:00",
                stadium: "Gillette Stadium",
                city: "Foxborough (Boston)"
            },
            {
                id: 3,
                stage: "Groupe C - Match 3",
                homeTeam: "Maroc",
                homeFlagUrl: "https://flagcdn.com/w160/ma.png",   
                awayTeam: "Haïti",
                awayFlagUrl: "https://flagcdn.com/w160/ht.png",   
                dateStr: "24/06/2026",
                timeStr: "23:00",
                timestamp: "2026-06-24T23:00:00+01:00",
                stadium: "Mercedes-Benz Stadium",
                city: "Atlanta (Georgia)"
            }
        ];

        let selectedParentId = "root"; 
        let estAdmin = false; 
        let currentMatchId = null;
        let currentMatchData = null;

        function verifierEnregistrementUtilisateur() {
            const pseudoExistant = localStorage.getItem('supporter_pseudo');
            if (!pseudoExistant) {
                Swal.fire({
                    title: '<span class="fs-6 text-white fw-bold">🏆 Inscription Supporter</span>',
                    html: `
                        <p class="text-white-50 small mb-3">Bienvenue ! Veuillez choisir un pseudo unique pour publier vos messages.</p>
                        <label for="swal-reg-name" class="small mb-1 d-block text-start">Votre Pseudo :</label>
                        <input id="swal-reg-name" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Ex: Ahmed_Lions">
                    `,
                    allowOutsideClick: false,
                    allowEscapeKey: false,
                    confirmButtonText: 'S\'enregistrer',
                    confirmButtonColor: '#006233',
                    customClass: { popup: 'swal2-popup-dark' },
                    preConfirm: () => {
                        const pseudo = document.getElementById('swal-reg-name').value.trim();
                        if (!pseudo) {
                            Swal.showValidationMessage("Le pseudo est obligatoire !");
                            return false;
                        }
                        localStorage.setItem('supporter_pseudo', pseudo);
                        return pseudo;
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        Swal.fire({
                            icon: 'success',
                            title: 'Enregistré !',
                            text: `Bienvenue parmi nous, ${result.value} !`,
                            timer: 2000,
                            showConfirmButton: false,
                            customClass: { popup: 'swal2-popup-dark' }
                        });
                    }
                });
            }
        }

        function demanderConnexionAdmin() {
            Swal.fire({
                title: '<span class="fs-6 text-white fw-bold">Espace Administration</span>',
                html: `
                    <label for="swal-admin-pass" class="small mb-1 d-block text-start">Mot de passe requis :</label>
                    <input type="password" id="swal-admin-pass" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Entrez le mot de passe">
                `,
                showCancelButton: true,
                confirmButtonText: 'Valider',
                confirmButtonColor: '#8b0000',
                cancelButtonText: 'Annuler',
                customClass: { popup: 'swal2-popup-dark' },
                preConfirm: () => {
                    const pass = document.getElementById('swal-admin-pass').value;
                    if (pass === "Seddik") {
                        return true;
                    } else {
                        Swal.showValidationMessage("Mot de passe incorrect !");
                        return false;
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    estAdmin = true;
                    document.getElementById('admin-zone').innerHTML = `<span class="admin-badge"><i class="fa-solid fa-user-shield me-1"></i> Admin</span>`;
                    Swal.fire({
                        icon: 'success',
                        title: 'Mode Admin activé',
                        text: 'Modération groupée par cases à cocher débloquée.',
                        timer: 1500,
                        showConfirmButton: false,
                        customClass: { popup: 'swal2-popup-dark' }
                    });
                    if (currentMatchId) {
                        openCommentsModal(currentMatchId);
                    }
                }
            });
        }

        function renderMatches() {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';

            matchesData.forEach(match => {
                const result = matchResults[match.id] || { homeScore: 0, awayScore: 0 };
                
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <div class="match-header d-flex justify-content-between align-items-center">
                        <span><i class="fa-solid fa-trophy text-warning me-1"></i> ${match.stage}</span>
                        <span><i class="fa-regular fa-clock me-1"></i> ${match.dateStr}</span>
                    </div>
                    <div class="match-body d-flex align-items-center justify-content-between">
                        <div class="team-box">
                            <img src="${match.homeFlagUrl}" alt="${match.homeTeam}" class="flag-img">
                            <span class="team-name">${match.homeTeam}</span>
                            <span class="match-result">${result.homeScore}</span>
                        </div>
                        <div class="vs-box">
                            <span class="badge-vs">VS</span>
                            <div class="countdown-timer" id="timer-${match.id}">Calcul...</div>
                        </div>
                        <div class="team-box">
                            <img src="${match.awayFlagUrl}" alt="${match.awayTeam}" class="flag-img">
                            <span class="team-name">${match.awayTeam}</span>
                            <span class="match-result">${result.awayScore}</span>
                        </div>
                    </div>
                    <div class="match-actions d-flex gap-2">
                        <button class="btn btn-action btn-info-match flex-grow-1" onclick="showMatchDetails(${match.id})">
                            <i class="fa-solid fa-circle-info me-1"></i> Détails
                        </button>
                        <button class="btn btn-action btn-comment-match flex-grow-1" onclick="openCommentsModal(${match.id})">
                            <i class="fa-regular fa-comments me-1"></i> Commentaires
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateCountdowns() {
            const now = new Date().getTime();
            matchesData.forEach(match => {
                const timerElement = document.getElementById(`timer-${match.id}`);
                if (!timerElement) return;
                const distance = new Date(match.timestamp).getTime() - now;
                if (distance < 0) {
                    timerElement.innerHTML = "<span class='text-secondary'>Match terminé</span>";
                } else {
                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    timerElement.innerHTML = days > 0 ? `J-${days} ${hours}h` : `${hours}h`;
                }
            });
        }

        function showMatchDetails(id) {
            const match = matchesData.find(m => m.id === id);
            Swal.fire({
                title: `<span class="fs-6 text-white fw-bold">${match.homeTeam} vs ${match.awayTeam}</span>`,
                html: `<div class="text-start mt-2 small text-white-50">
                    <p class="mb-2"><i class="fa-solid fa-map-pin text-danger me-2"></i><strong>Stade :</strong> ${match.stadium}</p>
                    <p class="mb-2"><i class="fa-solid fa-city text-info me-2"></i><strong>Ville :</strong> ${match.city}</p>
                    <p class="mb-2"><i class="fa-solid fa-calendar me-2"></i><strong>Date :</strong> ${match.dateStr}</p>
                    <p class="mb-0"><i class="fa-solid fa-clock me-2"></i><strong>Heure :</strong> ${match.timeStr} (Heure Maroc)</p>
                </div>`,
                confirmButtonColor: '#8b0000',
                customClass: { popup: 'swal2-popup-dark' }
            });
        }

        function toggleSelectAllAdmin(mainCheckbox) {
            const checkboxes = document.querySelectorAll('.comment-select-chk');
            checkboxes.forEach(chk => chk.checked = mainCheckbox.checked);
        }

        async function executerSuppressionGroupree(matchId) {
            const checkedBoxes = document.querySelectorAll('.comment-select-chk:checked');
            if (checkedBoxes.length === 0) {
                Swal.fire({ icon: 'warning', title: 'Attention', text: 'Aucun message coché.', customClass: { popup: 'swal2-popup-dark' } });
                return;
            }

            const confirmation = await Swal.fire({
                title: 'Confirmer la suppression ?',
                text: `Vous allez supprimer ${checkedBoxes.length} message(s) sélectionné(s).`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Oui, tout supprimer',
                cancelButtonText: 'Annuler',
                customClass: { popup: 'swal2-popup-dark' }
            });

            if (!confirmation.isConfirmed) { return; }

            const loadingToast = Swal.fire({ title: 'Suppression en cours...', didOpen: () => { Swal.showLoading(); }, allowOutsideClick: false });

            try {
                const idsA_Supprimer = Array.from(checkedBoxes).map(chk => chk.value);
                const urlParams = new URLSearchParams();
                urlParams.append("action", "delete");
                urlParams.append("commentId", idsA_Supprimer.join(",")); 

                await fetch(GOOGLE_SHEET_SCRIPT_URL, {
                    method: "POST",
                    body: urlParams
                });

                await new Promise(resolve => setTimeout(resolve, 800));
                loadingToast.close();
                openCommentsModal(matchId); 
            } catch (err) {
                loadingToast.close();
                Swal.fire({ icon: 'error', title: 'Erreur', text: 'Action impossible.', customClass: { popup: 'swal2-popup-dark' } });
            }
        }

        function afficherChargementModale() {
            Swal.fire({
                title: '<div class="loading-text"><div class="loading-spinner"></div>Chargement de la discussion...</div>',
                showConfirmButton: false,
                allowOutsideClick: false,
                customClass: { popup: 'swal2-popup-dark' }
            });
        }

        function formatMessageWithLineBreaks(message) {
            if (!message) return '';
            return escapeHtml(message).replace(/\n/g, '<br>').replace(/\r/g, '');
        }

        // Fonction améliorée pour la modale de saisie - avec gestion optimale du clavier
        async function openMessageFormModal(matchId, parentId, parentName) {
            const pseudoSauvegarde = localStorage.getItem('supporter_pseudo') || '';
            const isReply = parentId !== "root";
            
            const modalHtml = `
                <div class="message-form-container" id="messageFormContainer">
                    ${isReply ? `<div class="reply-badge text-center">
                        <i class="fa-solid fa-reply me-1"></i> En réponse à : <strong>${escapeHtml(parentName)}</strong>
                    </div>` : ''}
                    
                    <div class="mb-3">
                        <label class="small mb-1 d-block text-white-50">Votre pseudo :</label>
                        <input type="text" id="msg-pseudo" class="form-control bg-dark text-white border-secondary" 
                               placeholder="Votre pseudo" value="${pseudoSauvegarde.replace(/"/g, '&quot;')}" 
                               style="font-size: 16px; padding: 12px;">
                    </div>
                    
                    <div class="mb-3">
                        <label class="small mb-1 d-block text-white-50">Votre message :</label>
                        <textarea id="msg-content" class="form-control bg-dark text-white border-secondary" 
                                  rows="5" placeholder="Écrivez votre message ici...&#10;Appuyez sur Entrée pour passer à la ligne"
                                  style="font-size: 16px; resize: vertical; padding: 12px;"></textarea>
                    </div>
                </div>
            `;

            const result = await Swal.fire({
                title: '<i class="fa-regular fa-pen-to-square me-2 text-success"></i> Nouveau message',
                html: modalHtml,
                showCancelButton: true,
                confirmButtonText: '<i class="fa-regular fa-paper-plane me-1"></i> Envoyer',
                cancelButtonText: 'Annuler',
                confirmButtonColor: '#006233',
                cancelButtonColor: '#6c757d',
                customClass: { popup: 'swal2-popup-message-form' },
                willOpen: () => {
                    // Désactiver le scroll automatique de Swal
                    setTimeout(() => {
                        const textarea = document.getElementById('msg-content');
                        const pseudoInput = document.getElementById('msg-pseudo');
                        
                        if (textarea) {
                            // S'assurer que le textarea a le focus et ajuster la position
                            textarea.focus();
                            
                            // Redimensionnement automatique
                            const autoResize = (ta) => {
                                ta.style.height = 'auto';
                                ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
                            };
                            
                            textarea.addEventListener('input', function() {
                                autoResize(this);
                            });
                            autoResize(textarea);
                        }
                        
                        // Pour les très petits écrans, s'assurer que le formulaire est visible
                        const container = document.querySelector('.message-form-container');
                        if (container && window.innerHeight < 600) {
                            container.style.maxHeight = '70vh';
                        }
                    }, 100);
                },
                didOpen: () => {
                    // Écouter le clavier pour améliorer l'expérience
                    const textarea = document.getElementById('msg-content');
                    if (textarea) {
                        // Éviter que le textarea ne soit caché
                        textarea.addEventListener('focus', () => {
                            setTimeout(() => {
                                textarea.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }, 300);
                        });
                    }
                },
                preConfirm: () => {
                    const pseudo = document.getElementById('msg-pseudo').value.trim();
                    const message = document.getElementById('msg-content').value;
                    if (!pseudo) {
                        Swal.showValidationMessage('Veuillez entrer votre pseudo');
                        return false;
                    }
                    if (!message.trim()) {
                        Swal.showValidationMessage('Veuillez écrire un message');
                        return false;
                    }
                    return { pseudo, message };
                }
            });

            if (result.isConfirmed) {
                localStorage.setItem('supporter_pseudo', result.value.pseudo);
                
                const loadingSend = Swal.fire({ 
                    title: '<div class="loading-text"><div class="loading-spinner"></div>Envoi du message...</div>', 
                    showConfirmButton: false, 
                    allowOutsideClick: false, 
                    customClass: { popup: 'swal2-popup-dark' } 
                });

                const commentId = "c_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
                const aujourdhui = new Date();
                const jj = String(aujourdhui.getDate()).padStart(2, '0');
                const mm = String(aujourdhui.getMonth() + 1).padStart(2, '0');
                const aaaa = aujourdhui.getFullYear();
                const dateFormatee = `${jj}/${mm}/${aaaa}`;

                const urlParams = new URLSearchParams();
                urlParams.append("action", "add");
                urlParams.append("matchId", matchId);
                urlParams.append("commentId", commentId);
                urlParams.append("parentId", parentId);
                urlParams.append("nom", result.value.pseudo);
                urlParams.append("commentaire", result.value.message);
                urlParams.append("date", dateFormatee);

                try {
                    await fetch(GOOGLE_SHEET_SCRIPT_URL, {
                        method: "POST",
                        body: urlParams
                    });
                    loadingSend.close();
                    Swal.fire({ icon: 'success', title: 'Message envoyé!', timer: 1000, showConfirmButton: false, customClass: { popup: 'swal2-popup-dark' } });
                    setTimeout(() => openCommentsModal(matchId), 1000);
                } catch (err) {
                    loadingSend.close();
                    Swal.fire({ icon: 'error', title: 'Erreur', text: 'Impossible d\'envoyer.', customClass: { popup: 'swal2-popup-dark' } });
                }
            }
        }

        async function openCommentsModal(matchId) {
            currentMatchId = matchId;
            currentMatchData = matchesData.find(m => m.id === matchId);
            selectedParentId = "root";
            
            afficherChargementModale();
            
            let treeHtml = '<p class="text-muted small my-5 text-center">Aucun message. Laissez un mot de soutien !</p>';
            let bulkActionBarHtml = '';

            let matchComments = [];
            try {
                if(GOOGLE_SHEET_SCRIPT_URL !== "") {
                    const response = await fetch(`${GOOGLE_SHEET_SCRIPT_URL}?_cb=${Date.now()}`);
                    const list = await response.json();
                    matchComments = list.filter(c => c.matchId == matchId);
                }
            } catch (e) {
                console.warn("Erreur chargement commentaires", e);
            }

            if(matchComments.length > 0) {
                treeHtml = "";
                const roots = matchComments.filter(c => c.parentId === "root");
                const replies = matchComments.filter(c => c.parentId !== "root");

                roots.forEach(root => {
                    const dateRacineFormatee = formaterDateISO(root.date);
                    const safeRootNom = escapeHtml(root.nom).replace(/'/g, "\\'");
                    const chkBoxAdminRoot = estAdmin ? `<input type="checkbox" class="admin-checkbox comment-select-chk me-2 mt-1" value="${root.commentId}">` : '';
                    const formattedMessage = formatMessageWithLineBreaks(root.commentaire);

                    treeHtml += `
                        <div class="root-comment text-start">
                            <div class="d-flex align-items-start">
                                ${chkBoxAdminRoot}
                                <div class="flex-grow-1">
                                    <div class="d-flex justify-content-between" style="font-size:0.75rem;">
                                        <strong class="text-success small">${escapeHtml(root.nom)}</strong>
                                        <span class="text-muted" style="font-size:0.7rem;">${dateRacineFormatee}</span>
                                    </div>
                                    <div class="comment-message mt-1">${formattedMessage}</div>
                                    <div class="text-end mt-1">
                                        <button class="btn-reply-link" onclick="openMessageFormModal(${matchId}, '${root.commentId}', '${safeRootNom}')">Répondre</button>
                                    </div>
                                </div>
                            </div>
                    `;
                    
                    const subReplies = replies.filter(r => r.parentId === root.commentId);
                    subReplies.forEach(reply => {
                        const dateReponseFormatee = formaterDateISO(reply.date);
                        const chkBoxAdminReply = estAdmin ? `<input type="checkbox" class="admin-checkbox comment-select-chk me-2 mt-1" value="${reply.commentId}">` : '';
                        const formattedReplyMessage = formatMessageWithLineBreaks(reply.commentaire);

                        treeHtml += `
                            <div class="reply-comment">
                                <div class="d-flex align-items-start">
                                    ${chkBoxAdminReply}
                                    <div class="flex-grow-1">
                                        <div class="d-flex justify-content-between" style="font-size:0.72rem;">
                                            <strong style="color: #00ff87;">${escapeHtml(reply.nom)}</strong>
                                            <span class="text-muted" style="font-size:0.65rem;">${dateReponseFormatee}</span>
                                        </div>
                                        <div class="comment-message mt-1">${formattedReplyMessage}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    treeHtml += `</div>`; 
                });
            }

            if (estAdmin && matchComments.length > 0) {
                bulkActionBarHtml = `
                    <div class="admin-bulk-bar d-flex align-items-center justify-content-between text-start flex-shrink-0" style="margin: 10px 15px 0 15px;">
                        <div class="d-flex align-items-center gap-2">
                            <input type="checkbox" id="chk-all-admin" class="admin-checkbox" onchange="toggleSelectAllAdmin(this)">
                            <label for="chk-all-admin" class="small text-white-50 m-0" style="cursor:pointer">Tout cocher</label>
                        </div>
                        <button class="btn btn-danger btn-sm py-0 px-2 fw-bold" style="font-size:0.75rem" onclick="executerSuppressionGroupree(${matchId})">
                            <i class="fa-solid fa-trash-can me-1"></i> Supprimer la sélection
                        </button>
                    </div>
                `;
            }

            Swal.close();

            Swal.fire({
                title: '',
                showConfirmButton: false,
                showCancelButton: false,
                customClass: { popup: 'swal2-popup-fullscreen-maroc' },
                html: `
                    <div style="height:100%; display:flex; flex-direction:column;">
                        <div class="discussion-header-fixed">
                            <h3><i class="fa-regular fa-comments me-2 text-warning"></i>Espace de Discussion</h3>
                            <p>${currentMatchData.homeTeam} vs ${currentMatchData.awayTeam}</p>
                        </div>
                        ${bulkActionBarHtml}
                        <div class="comment-container-fullscreen" id="comment-scroll-area">
                            ${treeHtml}
                        </div>
                        <div class="discussion-footer-fixed">
                            <button class="btn-add-comment" onclick="openMessageFormModal(${matchId}, 'root', null)">
                                <i class="fa-regular fa-plus-circle me-2"></i> Ajouter un commentaire
                            </button>
                        </div>
                    </div>
                `,
                didOpen: () => {
                    const scrollArea = document.getElementById('comment-scroll-area');
                    if (scrollArea) {
                        setTimeout(() => {
                            scrollArea.scrollTop = scrollArea.scrollHeight;
                        }, 100);
                    }
                }
            });
        }

        function formaterDateISO(dateISO) {
            if (!dateISO) return "";
            if (typeof dateISO === 'string' && dateISO.includes('/')) return dateISO;
            
            const dateObj = new Date(dateISO);
            if (isNaN(dateObj.getTime())) return dateISO; 

            const jj = String(dateObj.getDate()).padStart(2, '0');
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const aaaa = dateObj.getFullYear();

            return `${jj}/${mm}/${aaaa}`;
        }

        function escapeHtml(t) {
            if(!t) return '';
            return t.toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('DOMContentLoaded', () => { 
            renderMatches(); 
            updateCountdowns(); 
            setInterval(updateCountdowns, 60000); 
            setTimeout(verifierEnregistrementUtilisateur, 1000);
        });
    </script>
</body>
</html>
